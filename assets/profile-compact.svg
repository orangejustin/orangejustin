<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc">
  <title id="title">Zecheng (Justin) Li — Full-stack Data Scientist</title>
  <desc id="desc">Curious, Innovative, Motivated. An orange at the center of a constellation of data points, with a slow decorative orbit. All text remains visible without animation.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#181e27"/><stop offset="1" stop-color="#202127"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#ffa355" stop-opacity=".12"/><stop offset="1" stop-color="#ffa355" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orange" x2=".8" y2="1">
      <stop stop-color="#ffc878"/><stop offset="1" stop-color="#f58b3f"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#a9b1bb" fill-opacity=".1"/>
    </pattern>
    <clipPath id="frame"><rect width="600" height="480" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orbit { animation: orbit 32s linear infinite; }
    .spark { animation: breathe 8s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .spark { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="600" height="480" fill="url(#background)"/>
    <rect x="300" width="600" height="480" fill="url(#dots)"/>
    <text class="mono" x="36" y="48" fill="#ffb66e" font-size="18" letter-spacing="1.5">@orangejustin</text>
    <text x="32" y="131" fill="#fff5e9" font-size="76" font-weight="700" letter-spacing="-3">Justin Li<tspan fill="#ffab5b">.</tspan></text>
    <text x="36" y="169" fill="#a9b1bb" font-size="23">Zecheng (Justin) Li</text>
    <text x="36" y="224" fill="#fff5e9" font-size="27">Full-stack Data Scientist</text>
    <path d="M 36 259 H 564" stroke="#3b3530"/>
    <text x="36" y="315" fill="#e4ddd4" font-size="25">Curious.</text>
    <text x="36" y="353" fill="#e4ddd4" font-size="25">Innovative.</text>
    <text x="36" y="391" fill="#e4ddd4" font-size="25">Motivated.</text>
    <g transform="translate(440 351) scale(0.77)" aria-hidden="true">
      <circle r="136" fill="url(#halo)"/>
      <circle r="110" fill="none" stroke="#ffb66e" stroke-opacity=".2"/>
      <circle r="88" fill="none" stroke="#ffb66e" stroke-opacity=".25" stroke-dasharray="2 9"/>
      <path d="M 0 0 L 0.00 -88.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="0.00" cy="-88.00" r="5" fill="#ffb66e"/><path d="M 0 0 L 76.21 -44.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="76.21" cy="-44.00" r="5" fill="#ffb66e"/><path d="M 0 0 L 76.21 44.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="76.21" cy="44.00" r="5" fill="#ffb66e"/><path d="M 0 0 L 0.00 88.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="0.00" cy="88.00" r="5" fill="#ffb66e"/><path d="M 0 0 L -76.21 44.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="-76.21" cy="44.00" r="5" fill="#ffb66e"/><path d="M 0 0 L -76.21 -44.00" stroke="#ffb66e" stroke-opacity=".24"/><circle cx="-76.21" cy="-44.00" r="5" fill="#ffb66e"/>
      <path d="M -76.21 -44 L 0 -88 L 76.21 -44 L 76.21 44 L 0 88 L -76.21 44 Z" fill="none" stroke="#ffb66e" stroke-opacity=".16"/>
      <g class="orbit">
        <path d="M 110 0 A 110 110 0 0 1 0 110" fill="none" stroke="#ffab5b" stroke-width="2" stroke-linecap="round"/>
        <circle cx="110" r="5" fill="#ffd4a8"/>
      </g>
      <circle class="spark" cx="-110" r="3" fill="#ffab5b"/>
      <circle r="36" fill="url(#orange)"/>
      <path d="M 1 -34 C 4 -48 20 -51 27 -43 C 22 -32 8 -29 1 -34 Z" fill="#dce4b1"/>
      <path d="M -14 -17 C -22 -11 -23 -1 -22 4" fill="none" stroke="#fff0d6" stroke-width="3" stroke-linecap="round" stroke-opacity=".8"/>
      <circle cx="14" cy="18" r="2" fill="#b75b24" fill-opacity=".35"/>
      <circle cx="21" cy="10" r="1.5" fill="#b75b24" fill-opacity=".35"/>
    </g>
    <path d="M 36 438 H 80" stroke="#ffab5b" stroke-width="3"/>
  </g>
</svg>
